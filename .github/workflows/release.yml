name: Release

on:
  push:
    tags:
      - v*.*.*

permissions:
  contents: read

jobs:
  # Privilege separation: this job runs project code (pytest) but holds no
  # OIDC publishing rights; the publish job holds the rights but runs no
  # project code — it only uploads the artifacts this job built.
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7
        with:
          # The guard below walks the default branch's history.
          fetch-depth: 0

      # Tagging a release branch tip publishes before that branch's pull
      # request has been reviewed: v0.4.0 reached PyPI that way and needed a
      # same-day v0.4.1 for three defects found afterwards, as v0.3.0 had
      # before it. Merge first, then tag the merge commit.
      #
      # The test is first-parent membership, not reachability: every commit
      # the release branch carried becomes reachable the moment it merges, so
      # re-running the run this guard stopped would publish one of them
      # without whatever the review added. The first-parent chain is the
      # sequence of states the default branch has actually held, which is
      # exactly the set that has been through a pull request.
      #
      # git rather than the API, because an API call that fails expands to an
      # empty string and would wave the tag through; a git failure here leaves
      # grep with no match and refuses.
      - name: Refuse a tag that the default branch has never pointed at
        env:
          BASE: ${{ github.event.repository.default_branch }}
        run: |
          git fetch --quiet origin "+refs/heads/${BASE}:refs/remotes/origin/${BASE}"
          if ! git rev-list --first-parent "refs/remotes/origin/${BASE}" \
            | grep -qx "$GITHUB_SHA"; then
            echo "::error::$GITHUB_REF_NAME points at a commit $BASE has never" \
              "held; merge the release pull request and tag the merge commit"
            exit 1
          fi

      - uses: astral-sh/setup-uv@v5

      # Both halves the release job reads are checked here, so a changelog
      # omission fails before anything is published rather than after.
      - name: Check the CHANGELOG documents the tag
        env:
          TAG: ${{ github.ref_name }}
        run: |
          grep -q "^## \[$TAG\]" CHANGELOG.md \
            || { echo "::error::CHANGELOG has no '## [$TAG]' section"; exit 1; }
          grep -q "^\[$TAG\]: " CHANGELOG.md \
            || { echo "::error::CHANGELOG has no '[$TAG]: ' compare link"; exit 1; }

      - name: Run tests
        run: uv run --frozen pytest -q

      - name: Build distributions
        run: uv build

      - uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/
          if-no-files-found: error

  publish:
    runs-on: ubuntu-latest
    needs: build
    environment: pypi
    permissions:
      # Required for PyPI trusted publishing (OIDC).
      id-token: write
    steps:
      - uses: astral-sh/setup-uv@v5

      - uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist/

      - name: Publish to PyPI
        run: uv publish

  # Runs after the artifacts are on PyPI, holds the only write access to
  # repository contents, and runs no project code — the notes come from the
  # tagged CHANGELOG, which is the single source for a release's contents.
  github-release:
    runs-on: ubuntu-latest
    needs: publish
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7

      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
        run: |
          notes=$(awk -v t="$TAG" \
            'index($0, "## [" t "]") == 1 { f = 1; print; next } f && /^## \[/ { exit } f' \
            CHANGELOG.md)
          test -n "$notes" || { echo "::error::no CHANGELOG section for $TAG"; exit 1; }
          url=$(grep -m1 "^\[$TAG\]: " CHANGELOG.md | cut -d' ' -f2-)
          printf '%s\n\n**Full Changelog**: %s\n' "$notes" "$url" > "$RUNNER_TEMP/notes.md"
          # --verify-tag: gh creates a missing tag from the default branch,
          # so a tag deleted while the publish environment was pending would
          # come back here pointing at unrelated source.
          gh release create "$TAG" --verify-tag \
            --title "🔖 Release $TAG" --notes-file "$RUNNER_TEMP/notes.md"
