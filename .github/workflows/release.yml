name: Release

on:
  push:
    tags:
      - v*.*.*

permissions:
  contents: read

jobs:
  # Privilege separation: this job runs project code (pytest) but holds no
  # OIDC publishing rights; the publish job holds the rights but runs no
  # project code — it only uploads the artifacts this job built.
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1

      # Tagging a release branch tip publishes before that branch's pull
      # request has been reviewed: v0.4.0 reached PyPI that way and needed a
      # same-day v0.4.1 for three defects found afterwards, as v0.3.0 had
      # before it. Merge first, then tag the merge commit. A tag anywhere
      # else stops here, ahead of the build and well ahead of the upload.
      - name: Refuse a tag that is not a merge commit on the default branch
        env:
          GH_TOKEN: ${{ github.token }}
          BASE: ${{ github.event.repository.default_branch }}
        run: |
          api="repos/$GITHUB_REPOSITORY"
          state=$(gh api "$api/compare/$BASE...$GITHUB_SHA" --jq .status)
          case "$state" in
            identical | behind) ;;
            *)
              echo "::error::$GITHUB_REF_NAME is $state relative to $BASE;" \
                "merge the release pull request and tag the merge commit"
              exit 1
              ;;
          esac
          # Reachability alone is not the rule. A tag pushed on the release
          # commit is refused while its branch is open, and then becomes an
          # ancestor the moment that branch merges — so re-running the very
          # run this guard stopped would publish that commit, without
          # whatever the review added on top of it. The merge commit is the
          # one that carries both.
          if [ "$(gh api "$api/commits/$GITHUB_SHA" --jq '.parents | length')" -lt 2 ]; then
            echo "::error::$GITHUB_REF_NAME has a single parent;" \
              "tag the merge commit, not the commit that was merged"
            exit 1
          fi

      - uses: astral-sh/setup-uv@d4b2f3b6ecc6e67c4457f6d3e41ec42d3d0fcb86 # v5.4.2

      # Both halves the release job reads are checked here, so a changelog
      # omission fails before anything is published rather than after.
      - name: Check the CHANGELOG documents the tag
        env:
          TAG: ${{ github.ref_name }}
        run: |
          grep -q "^## \[$TAG\]" CHANGELOG.md \
            || { echo "::error::CHANGELOG has no '## [$TAG]' section"; exit 1; }
          grep -q "^\[$TAG\]: " CHANGELOG.md \
            || { echo "::error::CHANGELOG has no '[$TAG]: ' compare link"; exit 1; }

      - name: Run tests
        run: uv run --frozen pytest -q

      - name: Build distributions
        run: uv build

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: dist
          path: dist/
          if-no-files-found: error

  publish:
    runs-on: ubuntu-latest
    needs: build
    environment: pypi
    permissions:
      # Required for PyPI trusted publishing (OIDC).
      id-token: write
    steps:
      - uses: astral-sh/setup-uv@d4b2f3b6ecc6e67c4457f6d3e41ec42d3d0fcb86 # v5.4.2

      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: dist
          path: dist/

      - name: Publish to PyPI
        run: uv publish

  # Runs after the artifacts are on PyPI, holds the only write access to
  # repository contents, and runs no project code — the notes come from the
  # tagged CHANGELOG, which is the single source for a release's contents.
  github-release:
    runs-on: ubuntu-latest
    needs: publish
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1

      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
        run: |
          notes=$(awk -v t="$TAG" \
            'index($0, "## [" t "]") == 1 { f = 1; print; next } f && /^## \[/ { exit } f' \
            CHANGELOG.md)
          test -n "$notes" || { echo "::error::no CHANGELOG section for $TAG"; exit 1; }
          url=$(grep -m1 "^\[$TAG\]: " CHANGELOG.md | cut -d' ' -f2-)
          printf '%s\n\n**Full Changelog**: %s\n' "$notes" "$url" > "$RUNNER_TEMP/notes.md"
          # --verify-tag: gh creates a missing tag from the default branch,
          # so a tag deleted while the publish environment was pending would
          # come back here pointing at unrelated source.
          gh release create "$TAG" --verify-tag \
            --title "🔖 Release $TAG" --notes-file "$RUNNER_TEMP/notes.md"
