name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  test:
    name: ${{ matrix.os }} / Python ${{ matrix.python }} / tomlkit ${{ matrix.tomlkit }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest]
        python: ["3.12", "3.13"]
        tomlkit: [0.15.0, 0.15.1]
        include:
          # One macOS entry, not a second full matrix: it is here to exercise
          # the ctypes ACL probe, which no Linux runner reaches.
          - os: macos-latest
            python: "3.13"
            tomlkit: 0.15.1
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v6
        with:
          python-version: ${{ matrix.python }}
      - run: uv sync --locked
      - run: uv pip install tomlkit==${{ matrix.tomlkit }}
      - run: uv run --no-sync pytest

  quality:
    name: Static quality gates
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v6
        with:
          python-version: "3.13"
      - run: uv sync --locked
      - run: uv run ruff check src tests
      - run: uv run ruff format --check src tests
      - run: uv run basedpyright
