[project]
name = "toml-tidy"
version = "0.4.0"
description = "Sort TOML keys without changing table hierarchy"
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "Dongmin Yu", email = "ydm2790@gmail.com" }]
requires-python = ">=3.12"
keywords = ["toml", "sort", "formatter", "cli", "tomlkit", "pyproject"]
classifiers = [
  "Development Status :: 4 - Beta",
  "Environment :: Console",
  "Intended Audience :: Developers",
  "Operating System :: OS Independent",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Topic :: Software Development :: Quality Assurance",
  "Topic :: Text Processing :: Markup",
]
dependencies = ["tomlkit>=0.15.0,<0.16", "typer>=0.16,<1"]

[project.urls]
Repository = "https://github.com/AndrewDongminYoo/toml_tidy"
Issues = "https://github.com/AndrewDongminYoo/toml_tidy/issues"

[project.scripts]
toml-tidy = "toml_tidy.cli:app"

[build-system]
requires = ["uv_build>=0.11.0,<0.12.0"]
build-backend = "uv_build"

[dependency-groups]
dev = ["basedpyright>=1.29", "pytest>=8", "ruff>=0.11"]

[tool.basedpyright]
typeCheckingMode = "all"
pythonVersion = "3.12"
pythonPlatform = "All"
include = ["src", "tests"]
exclude = ["**/__pycache__", "**/.venv", "**/build", "**/dist"]
reportUnusedCallResult = "warning"
reportUnnecessaryTypeIgnoreComment = "error"
reportUnusedVariable = "error"
reportMissingParameterType = "error"
reportPrivateUsage = "error"

[tool.ruff]
target-version = "py312"
line-length = 88
src = ["src", "tests"]

[tool.ruff.lint]
select = ["ALL"]
ignore = [
  "COM812",
  "CPY001",
  "D203",
  "D213",
  "FBT001",
  "FBT002",
  "FIX002",
  "ISC001",
  "Q003",
  "TD002",
  "TD003",
  "TRY003",
]

[tool.ruff.lint.per-file-ignores]
# A Typer command takes one parameter per CLI flag, and each flag is threaded
# down to the per-file worker, so both grow past the argument-count limit.
"src/toml_tidy/cli.py" = ["PLR0913", "PLR0917"]
"tests/**/*.py" = ["ARG", "D", "PLR2004", "S101", "SLF001"]

[tool.ruff.lint.pydocstyle]
convention = "google"

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
docstring-code-format = true
docstring-code-line-length = "dynamic"

[tool.pytest.ini_options]
minversion = "8.0"
testpaths = ["tests"]
addopts = ["-ra", "--strict-config", "--strict-markers"]
filterwarnings = ["error"]
